name: Build APK

on:
  push:
    branches: ['arena/**', 'main']
    paths:
      - 'android/**'
      - 'calculator/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || true
          java -version

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Inspect result
        run: |
          ls -la android/app/build/outputs/apk/debug/
          du -h android/app/build/outputs/apk/debug/*.apk
          unzip -l android/app/build/outputs/apk/debug/*.apk | head -40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: progcalc-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
