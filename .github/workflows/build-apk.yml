name: Build APK

on:
  push:
    branches: ['arena/**', 'main']
    paths:
      - 'android/**'
      - 'calculator/**'
      - '.github/workflows/build-apk.yml'
      # apk/** сюда не входит, поэтому коммит с готовым APK не запускает пересборку
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # чтобы закоммитить собранный APK обратно в ветку

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужен полный клон для push собранного APK

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || true
          java -version

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Inspect result
        run: |
          ls -la android/app/build/outputs/apk/debug/
          du -h android/app/build/outputs/apk/debug/*.apk
          unzip -l android/app/build/outputs/apk/debug/*.apk | head -40

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: progcalc-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Артефакты Actions отдаются с *.blob.core.windows.net, поэтому дублируем
      # APK в репозиторий: оттуда его можно достать через git / api.github.com.
      # Push делается токеном GITHUB_TOKEN — такой push не запускает новый прогон.
      - name: Commit APK to the branch
        run: |
          set -euo pipefail
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/progcalc-debug.apk
          ls -l apk/
          sha256sum apk/progcalc-debug.apk | tee apk/progcalc-debug.apk.sha256
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.com"
          git add apk/progcalc-debug.apk apk/progcalc-debug.apk.sha256
          if git diff --cached --quiet -- apk/progcalc-debug.apk; then
            echo "APK не изменился — коммит не нужен"
          else
            git commit -m "chore(apk): debug-сборка ${GITHUB_SHA::7}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "APK закоммичен в ${GITHUB_REF_NAME}"
          fi
